name: 翻译请愿
description: 填写游戏和目标语言即可请愿；原始 schema ZIP 可选
title: "[翻译请愿] 游戏名 (Steam app ID)"
labels: [翻译请愿]
body:
  - type: markdown
    attributes:
      value: |
        填写 App ID、游戏名和目标语言即可请愿，无需拥有或安装游戏。有原始 BIN 时可压缩为 ZIP 附上。

        机器人会尝试从 Steam 公开页面生成候选 JSON；数据不可获取时标记待补充来源，仍保留请愿。同一 Steam app ID 的翻译投稿 PR 合并后，会在此通知并自动关闭 issue。

        如果该 app ID 已经收录或已有正在审核的翻译 PR，机器人会评论现有下载地址或 PR 地址，并自动关闭此 issue。
  - type: input
    id: game_name
    attributes:
      label: 游戏名
      description: 按 Steam 商店显示填写。
      placeholder: Steam 商店中的游戏名
    validations:
      required: true
  - type: input
    id: app_id
    attributes:
      label: Steam app ID
      description: 只填写数字；如有附件，其文件名须与此 ID 一致。
      placeholder: "123456"
    validations:
      required: true
  - type: input
    id: target_languages
    attributes:
      label: 希望翻译到的语言
      description: 使用 Steam 语言代码；多个代码用半角逗号分隔。
      placeholder: schinese
    validations:
      required: true
  - type: textarea
    id: schema_zip
    attributes:
      label: 需要翻译的成就 schema ZIP
      description: 可选；上传 UserGameStatsSchema_<app_id>.zip，内含同名 BIN。无文件可留空。
      placeholder: 请把 ZIP 文件拖到这里。
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 可填写术语偏好、参考资料或其他希望译者注意的内容。
