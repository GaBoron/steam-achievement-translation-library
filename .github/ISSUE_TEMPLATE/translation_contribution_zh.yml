name: 提交 Steam 成就翻译
description: 提交独立翻译 JSON 或包含 BIN/JSON 的 schema ZIP
title: "[翻译投稿] 游戏名 (Steam app ID)"
labels: [翻译投稿]
body:
  - type: markdown
    attributes:
      value: |
        请先在 [翻译库网站](https://gaboron.github.io/steam-achievement-translation-library/?lang=zh) 和正在打开的翻译投稿 PR 中搜索 Steam app ID，确认没有相同游戏。自动化发现重复 ID 后会评论并关闭此 issue。

        可直接上传格式 2 的 `UserGameStatsSchema_<app_id>.json`，或上传原有 BIN ZIP；多版本 ZIP 使用 `translation-variants.json`。机器人校验来源、语言覆盖并创建审核 PR。独立 JSON 仅用于兼容客户端的文字显示，不能安装为 BIN。
  - type: input
    id: game_name
    attributes:
      label: 游戏名
      description: 按 Steam 商店显示填写；如果 Steam 显示名不是中文，可以在原名后空格间隔加上中文译名。
      placeholder: Steam 原名 中文译名
    validations:
      required: true
  - type: input
    id: app_id
    attributes:
      label: Steam app ID
      description: 只填写数字，可从 Steam 商店地址 `/app/<id>/` 取得。
      placeholder: "123456"
    validations:
      required: true
  - type: textarea
    id: schema_zip
    attributes:
      label: 翻译 JSON 或 schema ZIP
      description: 上传 UserGameStatsSchema_<app_id>.json（格式 2，完成译文并移除 draft）或同名 ZIP；多版本 ZIP 包含 translation-variants.json，每个版本选择 BIN 或 JSON。
      placeholder: 请把 JSON 或 ZIP 拖到这里。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 可填写翻译来源、术语说明、已自行测试的结果，或需要维护者注意的内容。
