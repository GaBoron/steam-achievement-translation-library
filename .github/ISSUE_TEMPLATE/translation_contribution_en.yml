name: Submit Steam achievement translation
description: Submit standalone translation JSON or a schema ZIP containing BIN/JSON
title: "[Translation] Game name (Steam app ID)"
labels: [翻译投稿]
body:
  - type: markdown
    attributes:
      value: |
        Search the [library website](https://gaboron.github.io/steam-achievement-translation-library/?lang=en) and open translation PRs for the Steam app ID before opening this issue. If automation finds a duplicate ID, it will comment and close this issue.

        Upload format 2 `UserGameStatsSchema_<app_id>.json` directly, or the existing BIN ZIP. Multi-version ZIPs use `translation-variants.json`. Automation checks source records and language coverage and creates a review PR. Standalone JSON is display text for compatible clients, not an installable BIN.
  - type: input
    id: game_name
    attributes:
      label: Game name
      description: Use the Steam store name. If the store name is not Chinese, you may append a Chinese translation after a space.
      placeholder: Steam store name optional translated name
    validations:
      required: true
  - type: input
    id: app_id
    attributes:
      label: Steam app ID
      description: Use digits only.
      placeholder: "123456"
    validations:
      required: true
  - type: textarea
    id: schema_zip
    attributes:
      label: Translation JSON or schema ZIP
      description: Upload UserGameStatsSchema_<app_id>.json (format 2, complete translations and remove draft) or the matching ZIP. Multi-version ZIPs include translation-variants.json; each variant contains BIN or JSON.
      placeholder: Drag the JSON or ZIP here.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Translation source, terminology notes, local testing notes, or anything maintainers should review.
