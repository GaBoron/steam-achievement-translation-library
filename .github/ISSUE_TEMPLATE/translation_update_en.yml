name: Update existing Steam achievement translation
description: Submit standalone translation JSON or a schema ZIP containing BIN/JSON
title: "[Translation update] Game name (Steam app ID)"
labels: [更新文件]
body:
  - type: markdown
    attributes:
      value: |
        Use this template only for games already accepted into Catalog V2. Open PRs do not count as accepted entries.

        If the uploaded file is identical to the current library file, automation will reject the update. Automation derives the store URL from the app ID and detects languages from the schema.
  - type: input
    id: game_name
    attributes:
      label: Game name
      description: Use the Steam store name. If the store name is not Chinese, you may append a Chinese translation after a space.
      placeholder: Steam store name optional translated name
    validations:
      required: true
  - type: input
    id: app_id
    attributes:
      label: Steam app ID
      placeholder: "123456"
    validations:
      required: true
  - type: textarea
    id: update_summary
    attributes:
      label: Update summary
      description: Describe what changed, such as new achievements, removed achievements, translation fixes, or added language fields.
      placeholder: List the additions, removals, changes, or fixes.
    validations:
      required: true
  - type: input
    id: variant_id
    attributes:
      label: Version ID to update
      description: Fill this only when replacing one version of a game that already has multiple versions. Leave it blank for a full package update or a single-version game.
      placeholder: version-description
  - type: textarea
    id: schema_zip
    attributes:
      label: Translation JSON or schema ZIP
      description: Upload UserGameStatsSchema_<app_id>.json (format 2, complete all declared languages) or the matching ZIP. Multi-version ZIPs include translation-variants.json; each variant contains BIN or JSON.
      placeholder: Drag the JSON or ZIP here.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Source, local testing notes, or details maintainers should verify.
