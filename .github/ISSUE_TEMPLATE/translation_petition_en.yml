name: Translation petition
description: Request a translation with app ID and target languages; the original schema ZIP is optional
title: "[Translation petition] Game name (Steam app ID)"
labels: [翻译请愿]
body:
  - type: markdown
    attributes:
      value: |
        Provide the app ID, game name and target languages; owning or installing the game is not required. If available, compress the original BIN into a ZIP and attach it.

        The bot tries to generate a candidate JSON from publicly exposed Steam achievements. If data is unavailable, the petition stays open awaiting source data. When a translation PR for the same Steam app ID is merged, this issue will be notified and closed automatically.

        If the app ID is already indexed or has an open translation PR, the bot comments with the existing download or PR URL and closes this issue automatically.
  - type: input
    id: game_name
    attributes:
      label: Game name
      description: Use the name shown in the Steam store.
      placeholder: Steam store game name
    validations:
      required: true
  - type: input
    id: app_id
    attributes:
      label: Steam app ID
      description: Use digits only; any attachment filename must match this ID.
      placeholder: "123456"
    validations:
      required: true
  - type: input
    id: target_languages
    attributes:
      label: Requested target languages
      description: Use Steam language codes separated by half-width commas.
      placeholder: schinese
    validations:
      required: true
  - type: textarea
    id: schema_zip
    attributes:
      label: Achievement schema ZIP to translate
      description: Optional; upload UserGameStatsSchema_<app_id>.zip containing the matching BIN, or leave blank.
      placeholder: Drag the ZIP file here.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Terminology preferences, references, or anything translators should know.
