name: 更新已有 Steam 成就翻译
description: 提交独立翻译 JSON 或包含 BIN/JSON 的 schema ZIP
title: "[翻译更新] 游戏名 (Steam app ID)"
labels: [更新文件]
body:
  - type: markdown
    attributes:
      value: |
        此模板只用于更新已经合并进库的游戏。机器人会按 Steam app ID 检查 Catalog V2；正在打开的 PR 不算已收录。

        如果上传文件与库里的当前文件完全相同，自动检查会拒绝创建 PR。机器人会根据 app ID 生成商店地址，并从 schema 自动识别语言。
  - type: input
    id: game_name
    attributes:
      label: 游戏名
      description: 按 Steam 商店显示填写；如果 Steam 显示名不是中文，可以在原名后空格间隔加上中文译名。
      placeholder: Steam 原名 中文译名
    validations:
      required: true
  - type: input
    id: app_id
    attributes:
      label: Steam app ID
      placeholder: "123456"
    validations:
      required: true
  - type: textarea
    id: update_summary
    attributes:
      label: 更新内容摘要
      description: 说明这次更新了什么，例如游戏更新后新增成就、删除旧成就、修正翻译、补充语言字段等。
      placeholder: 请简要列出新增、删除、修改或修正的内容。
    validations:
      required: true
  - type: input
    id: variant_id
    attributes:
      label: 要更新的版本 ID
      description: 仅在游戏已有多个版本、且本次只替换其中一个版本时填写；整包更新或单版本游戏留空。
      placeholder: version-description
  - type: textarea
    id: schema_zip
    attributes:
      label: 翻译 JSON 或 schema ZIP
      description: 上传 UserGameStatsSchema_<app_id>.json（格式 2，完成译文并移除 draft）或同名 ZIP；多版本 ZIP 包含 translation-variants.json，每个版本选择 BIN 或 JSON。
      placeholder: 请把 JSON 或 ZIP 拖到这里。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 可填写来源、测试情况，或维护者需要额外核对的内容。
