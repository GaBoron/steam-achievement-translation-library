name: Repository checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOW_UNINDEXED_SCHEMA_FILES: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'translation-library/') && github.event.pull_request.head.repo.full_name == github.repository }}
      ALLOW_STALE_DERIVED_ARTIFACTS: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'translation-library/') && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile workflow scripts
        run: python -m compileall -q workflow-scripts

      - name: Verify translation data and generated indexes
        run: |
          args=()
          if [ "$ALLOW_UNINDEXED_SCHEMA_FILES" = "true" ]; then
            args+=(--allow-unindexed-schema-files --allow-stale-index-metadata)
          fi
          if [ "$ALLOW_STALE_DERIVED_ARTIFACTS" = "true" ]; then
            args+=(--allow-stale-derived-artifacts)
          fi
          python workflow-scripts/check_repository.py "${args[@]}"
