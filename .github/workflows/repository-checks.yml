name: Repository checks

on:
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  repository-validation:
    # Use a different name for skipped reviews so they cannot satisfy the required check.
    name: >-
      ${{
        (
          github.event_name != 'pull_request_review' ||
          (
            github.event.review.state == 'approved' &&
            github.event.review.commit_id == github.event.pull_request.head.sha &&
            github.event.pull_request.state == 'open' &&
            !github.event.pull_request.draft &&
            github.event.pull_request.base.ref == 'main' &&
            startsWith(github.event.pull_request.head.ref, 'translation-library/') &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        ) && 'validate' || 'skip translation review'
      }}
    if: >-
      ${{
        github.event_name != 'pull_request_review' ||
        (
          github.event.review.state == 'approved' &&
          github.event.review.commit_id == github.event.pull_request.head.sha &&
          github.event.pull_request.state == 'open' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.base.ref == 'main' &&
          startsWith(github.event.pull_request.head.ref, 'translation-library/') &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The review event reports validate on the PR. Branch dispatch gives early feedback.
      TRANSLATION_PR: >-
        ${{
          github.event_name == 'pull_request_review' ||
          (github.event_name == 'pull_request' && startsWith(github.head_ref, 'translation-library/') && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/translation-library/'))
        }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      PR_HEAD_SHA: ${{ github.event.review.commit_id || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile workflow scripts
        run: python -m compileall -q workflow-scripts

      - name: Set up Node for JavaScript syntax validation
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript module syntax
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          for path in sorted(Path("web").rglob("*.js")):
              print(f"Checking {path}", flush=True)
              subprocess.run(["node", "--check", "--input-type=module"], input=path.read_bytes(), check=True)
          PY

      - name: Verify translation data and generated indexes
        run: |
          args=()
          if [ "$TRANSLATION_PR" = "true" ]; then
            args+=(--translation-pr --base-ref "$PR_BASE_SHA" --head-ref "$PR_HEAD_SHA")
          fi
          python workflow-scripts/check_repository.py "${args[@]}"

      # Translation PRs validate pending game metadata without changing Catalog V2.
      # Their indexed files can legitimately differ until post-merge finalization.
      - name: Build website and verify published downloads
        if: ${{ env.TRANSLATION_PR != 'true' }}
        run: python workflow-scripts/build_website.py --output "$RUNNER_TEMP/translation-library-site"
