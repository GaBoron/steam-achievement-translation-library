name: Repository checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRANSLATION_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'translation-library/') && github.event.pull_request.head.repo.full_name == github.repository }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile workflow scripts
        run: python -m compileall -q workflow-scripts

      - name: Set up Node for JavaScript syntax validation
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript module syntax
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          for path in sorted(Path("web").rglob("*.js")):
              print(f"Checking {path}", flush=True)
              subprocess.run(["node", "--check", "--input-type=module"], input=path.read_bytes(), check=True)
          PY

      - name: Verify translation data and generated indexes
        run: |
          args=()
          if [ "$TRANSLATION_PR" = "true" ]; then
            args+=(--translation-pr --base-ref "$PR_BASE_SHA" --head-ref "$PR_HEAD_SHA")
          fi
          python workflow-scripts/check_repository.py "${args[@]}"

      # Translation PRs validate pending game metadata without changing Catalog V2.
      # Their indexed files can legitimately differ until post-merge finalization.
      - name: Build website and verify published downloads
        if: ${{ env.TRANSLATION_PR != 'true' }}
        run: python workflow-scripts/build_website.py --output "$RUNNER_TEMP/translation-library-site"
