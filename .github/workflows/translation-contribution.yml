name: Translation library automation

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged translation PR number to finalize
        type: string
      head_branch:
        description: Translation head branch to finalize (for example translation-library/issue-14)
        type: string

permissions:
  contents: read

concurrency:
  group: translation-library-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  issue-review:
    needs: issue-comment-maintenance
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'issues' ||
          (
            github.event_name == 'issue_comment' &&
            (
              github.event.comment.body == '/force-refresh' ||
              needs.issue-comment-maintenance.outputs.review-required == 'true'
            )
          )
        ) &&
        !github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        (
          contains(github.event.issue.labels.*.name, '翻译投稿') ||
          contains(github.event.issue.labels.*.name, '更新文件') ||
          contains(github.event.issue.labels.*.name, '报告错误') ||
          contains(github.event.issue.body, '### 翻译 JSON 或 schema ZIP') ||
          contains(github.event.issue.body, '### Translation JSON or schema ZIP') ||
          contains(github.event.issue.body, '### 成就 schema ZIP') ||
          contains(github.event.issue.body, '### Uploaded achievement schema ZIP') ||
          contains(github.event.issue.body, '### 错误类型') ||
          contains(github.event.issue.body, '### Issue type')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation library
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh issue event
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workflow-scripts/issue_review_event.py --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/issue-review-event.json" --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN"

      - name: Guard issue label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workflow-scripts/github_issue_guard.py --event "$RUNNER_TEMP/issue-review-event.json" --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN"

      - name: Validate issue and update library files
        id: validate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workflow-scripts/library_submission_bot.py --event "$RUNNER_TEMP/issue-review-event.json" --token "$GITHUB_TOKEN"

      - name: Comment on failed review
        if: ${{ steps.validate.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f submission_result.json ]; then
            python - <<'PY' > issue-comment.md
          import json
          from pathlib import Path
          from datetime import UTC, datetime

          data = json.loads(Path("submission_result.json").read_text(encoding="utf-8"))
          errors = [str(item) for item in data.get("errors", [])]
          checked_at = datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          if data.get("retry_allowed"):
              print("自动检查未通过，但这些问题可以修正。")
              print()
          else:
              print("自动检查无法继续，此 issue 将被关闭。")
              print()
          print(f"- 检查时间：`{checked_at}`")
          if data.get("retry_allowed"):
              print("- 你可以直接编辑 open issue 的描述，或在评论区使用 `/update <类型> <参数>` 修正。")
              print("- 编辑描述时请只改字段内容，不要改 `### 字段标题`，否则机器人可能无法读取。")
              print("- 具体填写方式请参考 [贡献指南](https://github.com/GaBoron/steam-achievement-translation-library/blob/main/docs/CONTRIBUTING.md)。")
          print()
          print("## 问题说明")
          print()
          for item in errors:
              print(f"- {item}")
          PY
          else
            printf "自动检查失败，但没有生成详细报告。\n" > issue-comment.md
          fi
          ISSUE_LOCKED="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --jq '.locked')"
          if [ "$ISSUE_LOCKED" = "true" ]; then
            echo "Issue #$ISSUE_NUMBER is already locked; skipping failure comment."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file issue-comment.md
          if [ -f submission_result.json ] && [ "$(python -c 'import json; print(str(json.load(open("submission_result.json", encoding="utf-8")).get("close_issue", False)).lower())')" = "true" ]; then
            gh issue close "$ISSUE_NUMBER" --reason "not planned"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/lock" -f lock_reason=resolved
          fi

      - name: Export PR metadata
        id: meta
        if: ${{ steps.validate.outcome == 'success' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(Path("submission_result.json").read_text(encoding="utf-8"))
          for key in ("branch", "pr_labels", "commit_message", "commit_author", "pr_title", "game_id"):
              print(f"{key}={data[key]}")
          PY

      - name: Create pull request
        id: cpr
        if: ${{ steps.validate.outcome == 'success' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: ${{ steps.meta.outputs.branch }}
          title: ${{ steps.meta.outputs.pr_title }}
          body-path: pr_body.md
          commit-message: ${{ steps.meta.outputs.commit_message }}
          author: ${{ steps.meta.outputs.commit_author || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}
          # GitHub's signed-commit API sets the bot as the author.
          sign-commits: ${{ steps.meta.outputs.commit_author == '' }}
          labels: ${{ steps.meta.outputs.pr_labels }}
          reviewers: GaBoron
          add-paths: |
            files/${{ steps.meta.outputs.game_id }}/**

      - name: Run required checks on the submission branch
        if: ${{ steps.cpr.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          if [ -z "$PR_URL" ]; then
            echo "No submission PR was created."
            exit 1
          fi
          gh workflow run repository-checks.yml --ref "$PR_BRANCH"

      - name: Close and lock source issue
        if: ${{ steps.validate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          {
            printf "自动检查已通过，PR 已创建并等待维护者审核：\n\n"
            printf "%s\n\n" "$PR_URL"
            printf "此 issue 已关闭并锁定。后续如需修改 PR 内容，请在 PR 下评论 \`/update <类型> <参数>\` 命令。\n"
          } > issue-comment.md
          ISSUE_STATE="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --jq '.state')"
          ISSUE_LOCKED="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --jq '.locked')"
          if [ "$ISSUE_LOCKED" = "true" ]; then
            echo "Issue #$ISSUE_NUMBER is already locked; skipping close-and-lock notification."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file issue-comment.md
          if [ "$ISSUE_STATE" != "closed" ]; then
            gh issue close "$ISSUE_NUMBER" --reason "completed"
          fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/lock" -f lock_reason=resolved

  translation-petition-review:
    if: ${{ (github.event_name == 'issues' || (github.event_name == 'issue_comment' && github.event.comment.body == '/force-refresh')) && !github.event.issue.pull_request && github.event.issue.state == 'open' && (contains(github.event.issue.labels.*.name, '翻译请愿') || contains(github.event.issue.body, '### 需要翻译的成就 schema ZIP') || contains(github.event.issue.body, '### Achievement schema ZIP to translate')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout translation library
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Guard issue label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workflow-scripts/github_issue_guard.py --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN"

      - name: Validate and acknowledge translation petition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workflow-scripts/translation_petition_bot.py --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN"

      - name: Upload public achievement JSON draft
        uses: actions/upload-artifact@v4
        with:
          name: petition-json
          path: ${{ runner.temp }}/petition-json/*.json
          if-no-files-found: ignore
          retention-days: 30

  pr-review-requested-changes:
    if: ${{ github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'translation-library/') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Mark PR as waiting for update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workflow-scripts/translation_pr_maintenance.py --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN" --mark-wait-for-update

  pr-review-approved:
    if: >-
      ${{
        github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        github.event.review.commit_id == github.event.pull_request.head.sha &&
        github.event.pull_request.state == 'open' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.base.ref == 'main' &&
        startsWith(github.event.pull_request.head.ref, 'translation-library/') &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      checks: read
      contents: write
      issues: read
      pull-requests: write
      statuses: read
    outputs:
      merged: ${{ steps.wait-for-merge.outputs.merged }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Merge approved PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.review.commit_id }}
        run: |
          STATE="$(gh pr view "$PR_NUMBER" --json state --jq '.state')"
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is already $STATE; skipping merge."
            exit 0
          fi
          DRAFT="$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')"
          if [ "$DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is still a draft; skipping merge."
            exit 0
          fi
          python workflow-scripts/check_repository.py --translation-pr --base-ref "$PR_BASE_SHA" --head-ref "$PR_HEAD_SHA"
          TITLE="$(gh pr view "$PR_NUMBER" --json title --jq '.title')"
          BODY="$(python workflow-scripts/translation_pr_maintenance.py --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" --merge-commit-body)"
          gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$PR_HEAD_SHA" --delete-branch --subject "$TITLE" --body "$BODY"

      - name: Wait for automatic merge
        id: wait-for-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.review.commit_id }}
        run: |
          for attempt in $(seq 1 180); do
            STATUS="$(gh pr view "$PR_NUMBER" --json state,isDraft,headRefOid --jq '[.state, (.isDraft | tostring), .headRefOid] | @tsv')"
            IFS=$'\t' read -r STATE IS_DRAFT CURRENT_HEAD <<< "$STATUS"
            if [ "$STATE" = "MERGED" ]; then
              echo "PR #$PR_NUMBER has merged."
              echo 'merged=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATE" != "OPEN" ]; then
              echo "PR #$PR_NUMBER closed without merging."
              exit 1
            fi
            if [ "$IS_DRAFT" = "true" ] || [ "$CURRENT_HEAD" != "$PR_HEAD_SHA" ]; then
              echo "PR #$PR_NUMBER has a newer head or is now a draft. This review is no longer eligible for automatic merge."
              exit 0
            fi
            FAILED_CHECKS="$(
              gh pr checks "$PR_NUMBER" --required --json name,bucket \
                --jq '[.[] | select(.bucket == "fail") | .name] | join(", ")' 2>/dev/null || true
            )"
            if [ -n "$FAILED_CHECKS" ]; then
              echo "Required checks failed for PR #$PR_NUMBER: $FAILED_CHECKS"
              exit 1
            fi
            echo "Waiting for GitHub to merge PR #$PR_NUMBER after its requirements pass; attempt $attempt/180."
            sleep 10
          done
          echo "Timed out waiting for PR #$PR_NUMBER to merge."
          exit 1

  pr-comment-maintenance:
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Handle PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workflow-scripts/translation_pr_maintenance.py --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN" --handle-comment

  issue-comment-maintenance:
    if: ${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      review-required: ${{ steps.command-result.outputs.review-required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Handle issue comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python workflow-scripts/github_issue_guard.py --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN" --handle-comment --result "$RUNNER_TEMP/issue-comment-result.json"

      - name: Export comment result
        id: command-result
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "issue-comment-result.json").read_text(encoding="utf-8"))
          print(f"review-required={str(bool(result.get('review_required'))).lower()}")
          PY

  request-catalog-publication:
    needs: pr-review-approved
    if: >-
      ${{
        always() && !cancelled() &&
        (
          needs.pr-review-approved.outputs.merged == 'true' ||
          (
            github.event_name == 'pull_request' && github.event.pull_request.merged &&
            github.event.pull_request.base.ref == 'main' &&
            startsWith(github.event.pull_request.head.ref, 'translation-library/') &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # The publication environment only accepts runs targeting main.
      - name: Request publication on main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh workflow run translation-contribution.yml --repo "$GITHUB_REPOSITORY" --ref main -f "pr_number=$PR_NUMBER"

  finalize-merged-pr:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: catalog-publication
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: translation-library-main-finalize
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check publication credential
        env:
          CATALOG_DEPLOY_KEY: ${{ secrets.CATALOG_DEPLOY_KEY }}
        run: |
          if [ -z "$CATALOG_DEPLOY_KEY" ]; then
            echo '::error::Set CATALOG_DEPLOY_KEY in the catalog-publication environment.'
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Publish Catalog V2 and finish merged PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python workflow-scripts/translation_pr_maintenance.py --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN" --finalize-pr "$PR_NUMBER"
          elif [ -n "$HEAD_BRANCH" ]; then
            python workflow-scripts/translation_pr_maintenance.py --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN" --finalize-head-branch "$HEAD_BRANCH"
          else
            echo 'Provide a merged translation PR number or head branch.'
            exit 1
          fi
