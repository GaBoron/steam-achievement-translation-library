name: Translation library website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue build and deploy together so a new main push cannot cancel a deployment.
concurrency:
  group: translation-library-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Build current main in case another publication finished while this run queued.
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node for JavaScript syntax validation
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript module syntax
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          for path in sorted(Path("web").rglob("*.js")):
              print(f"Checking {path}", flush=True)
              subprocess.run(["node", "--check", "--input-type=module"], input=path.read_bytes(), check=True)
          PY

      - name: Build website and verify published downloads
        run: python workflow-scripts/build_website.py --refresh-covers --output "$RUNNER_TEMP/translation-library-site"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/translation-library-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
